# Yapı: kpss-lisans-2026 kılavuzu, "KPSS ve DHBT'ye katılacak adaylar için açıklamalar".
# DHBT-1 tüm öğrenim düzeylerinde ortak; DHBT-2 lisans, ön lisans ve ortaöğretim için ayrı müfredattan gelir.
ad: "Din Hizmetleri Alan Bilgisi Testi (DHBT)"
kisaAd: "DHBT"
grup: KPSS
sira: 5
aciklama: "Aday, KPSS'ye girdiği öğrenim düzeyinde DHBT'ye girer."
kaynak:
  belge: kpss-lisans-2026
  dogrulandi: true
oturumlar:
  - ad: DHBT
    sureDk: 60
    testler:
      - ad: Alan Bilgisi Testi
        soruSayisi: 40
        dersler:
          - ders: temel-din-bilgisi
            ad: "DHBT-1: Temel Din Bilgisi"
            soruSayisi: 20
            konular: [temel-din-bilgisi/islam-inanc-esaslari, temel-din-bilgisi/islam-ibadet-esaslari, temel-din-bilgisi/kuran-bilgisi, temel-din-bilgisi/siyer, temel-din-bilgisi/islam-ahlaki]
          - ders: din-hizmetleri-alan
            ad: "DHBT-2: Öğrenim Düzeyine Göre Alan Bilgisi"
            soruSayisi: 20
            konular: [din-hizmetleri-alan/tefsir, din-hizmetleri-alan/fikih, din-hizmetleri-alan/hadis, din-hizmetleri-alan/akaid-kelam, din-hizmetleri-alan/islam-tarihi, din-hizmetleri-alan/dinler-mezhepler-tarihi, din-hizmetleri-alan/dini-hitabet]
