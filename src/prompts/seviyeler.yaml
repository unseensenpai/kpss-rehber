# Seviye 1–5 (spec §7). Talimat, şablondaki {{seviyeTalimati}} yerine girer.
- id: temel
  seviye: 1
  ad: Temel
  talimat: Konuyu hiç bilmeyen birine anlatır gibi anlat. Terimleri ilk geçtiği yerde tanımla, günlük hayattan basit örnekler kullan, ön bilgi varsayma.
- id: kolay
  seviye: 2
  ad: Kolay
  talimat: Temel kavramları bildiğimi varsay ama hızlı bir hatırlatma yap. Örnekleri basit tut, bir adımı atlamadan ilerle.
- id: orta
  seviye: 3
  ad: Orta
  talimat: KPSS'ye hazırlanan ortalama bir aday seviyesinde anlat. Kavramları bağlantılarıyla ver, ÖSYM'nin sık sorduğu ayrımları vurgula.
- id: zor
  seviye: 4
  ad: Zor
  talimat: Temel bilgiyi bildiğimi varsay. Karıştırılan kavramlara, istisnalara ve çeldiricilere odaklan; birden fazla bilgiyi birleştiren örnekler kullan.
- id: ileri
  seviye: 5
  ad: İleri
  talimat: Konuya hâkim olduğumu varsay. Ayrıntılara, nadir sorulan noktalara ve ÖSYM'nin en zor soru kalıplarına odaklan; yorum ve çıkarım gerektiren örnekler ver.
