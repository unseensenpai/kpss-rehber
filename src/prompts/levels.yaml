# Levels 1–5 (spec §7). `instruction` replaces {{levelInstruction}} in templates.
- id: basic
  level: 1
  name: { tr: "Temel" }
  instruction: { tr: "Konuyu hiç bilmeyen birine anlatır gibi anlat. Terimleri ilk geçtiği yerde tanımla, günlük hayattan basit örnekler kullan, ön bilgi varsayma." }
- id: easy
  level: 2
  name: { tr: "Kolay" }
  instruction: { tr: "Temel kavramları bildiğimi varsay ama hızlı bir hatırlatma yap. Örnekleri basit tut, bir adımı atlamadan ilerle." }
- id: medium
  level: 3
  name: { tr: "Orta" }
  instruction: { tr: "KPSS'ye hazırlanan ortalama bir aday seviyesinde anlat. Kavramları bağlantılarıyla ver, ÖSYM'nin sık sorduğu ayrımları vurgula." }
- id: hard
  level: 4
  name: { tr: "Zor" }
  instruction: { tr: "Temel bilgiyi bildiğimi varsay. Karıştırılan kavramlara, istisnalara ve çeldiricilere odaklan; birden fazla bilgiyi birleştiren örnekler kullan." }
- id: advanced
  level: 5
  name: { tr: "İleri" }
  instruction: { tr: "Konuya hâkim olduğumu varsay. Ayrıntılara, nadir sorulan noktalara ve ÖSYM'nin en zor soru kalıplarına odaklan; yorum ve çıkarım gerektiren örnekler ver." }
