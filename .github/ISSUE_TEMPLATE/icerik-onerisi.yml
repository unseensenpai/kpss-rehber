name: İçerik önerisi
description: Yeni konu özeti, prompt şablonu ya da iyileştirme öner.
title: "[Öneri] "
labels: [icerik]
body:
  - type: dropdown
    id: tur
    attributes:
      label: Öneri türü
      options: [Konu özeti, Prompt şablonu, Yeni sınav / ders, Site özelliği, Diğer]
    validations:
      required: true
  - type: input
    id: konu
    attributes:
      label: İlgili sınav / ders / konu
      placeholder: KPSS Lisans › Tarih › Osmanlı Tarihi
  - type: textarea
    id: oneri
    attributes:
      label: Önerin
    validations:
      required: true
  - type: checkboxes
    id: onay
    attributes:
      label: Kurallar
      options:
        - label: Çıkmış soru metni kopyalamıyorum; ÖSYM verisi için resmi kaynak belirtiyorum.
          required: true
