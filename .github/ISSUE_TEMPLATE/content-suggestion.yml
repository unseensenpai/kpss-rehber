name: İçerik önerisi / Content suggestion
description: Yeni konu özeti, çeviri, prompt şablonu ya da iyileştirme öner. / Suggest a topic summary, translation, prompt template or improvement.
title: "[Öneri] "
labels: [content]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Öneri türü / Kind of suggestion
      options:
        - Konu özeti / Topic summary
        - Çeviri / Translation
        - Prompt şablonu / Prompt template
        - Yeni sınav / ders / New exam or subject
        - Site özelliği / Site feature
        - Diğer / Other
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: İlgili sınav / ders / konu / Related exam / subject / topic
      placeholder: KPSS Lisans › Tarih › Osmanlı Tarihi
  - type: textarea
    id: suggestion
    attributes:
      label: Önerin / Your suggestion
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Kurallar / Rules
      options:
        - label: Çıkmış soru metni kopyalamıyorum; ÖSYM verisi için resmi kaynak belirtiyorum. / I am not copying past exam questions and I cite an official source for ÖSYM data.
          required: true
